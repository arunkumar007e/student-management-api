
name: Student Management CI

on:
  push:
    branches: 
      main 
  pull_request:
    branches: 
       main 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: chmod +x mvnw && ./mvnw --batch-mode verify

      - name: Docker Build
        run: docker build -t student-management-api:1.0 .


      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USER_NAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: arunkumar78/student-management-api:1.0
